[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicu-scanner"
version = "0.1.4"
description = "LLM application security testing framework — prompt injection, safety bypass, and indirect injection scanner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jake Schoellkopf" },
]
keywords = ["llm", "security", "prompt-injection", "ai-security", "pentesting", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx==0.27.0",
    "rich==13.9.4",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
]

[project.scripts]
aicu = "aicu.main:main"

[project.urls]
Homepage = "https://github.com/Jake-Schoellkopf/aicu"
Repository = "https://github.com/Jake-Schoellkopf/aicu"
Issues = "https://github.com/Jake-Schoellkopf/aicu/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aicu"]

[tool.hatch.build.targets.wheel.force-include]
"payloads" = "aicu/payloads"
"profiles" = "aicu/profiles"

[tool.hatch.build.targets.sdist]
include = ["src/aicu", "payloads", "profiles", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
