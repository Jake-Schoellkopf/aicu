name: Record Demo

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aicu
        run: pip install -e .

      - name: Install asciinema and svg-term
        run: |
          pip install asciinema
          npm install -g svg-term-cli

      - name: Record demo
        run: |
          # Start demo server in background
          python demo_server.py &
          sleep 2

          # Record a quick single-turn scan (fewer mutations, shows results)
          asciinema rec demo.cast --overwrite --command "python main.py single-turn --request examples/demo_request.txt --best-of-n 1" --cols 100 --rows 30

          # Kill demo server
          kill %1 || true

      - name: Convert to SVG
        run: |
          # Speed up: cap delays between frames to 0.2s
          python -c "
          import json, sys
          lines = open('demo.cast').readlines()
          out = open('demo_fast.cast', 'w')
          out.write(lines[0])
          prev = 0
          offset = 0
          for line in lines[1:]:
              ev = json.loads(line)
              gap = ev[0] - prev
              if gap > 0.2:
                  offset += gap - 0.2
              prev = ev[0]
              ev[0] = round(ev[0] - offset, 3)
              out.write(json.dumps(ev) + '\n')
          "
          svg-term --in demo_fast.cast --out demo.svg --window --width 100 --height 30

      - name: Commit demo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add demo.svg demo.cast
          git diff --cached --quiet || git commit -m "Update demo recording"
          git push
