name: Record Demo

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aicu
        run: pip install -e .

      - name: Install asciinema and svg-term
        run: |
          pip install asciinema
          npm install -g svg-term-cli

      - name: Record demo
        run: |
          # Create a script that outputs realistic AICU scan results
          cat > /tmp/demo_script.sh << 'EOF'
          echo '$ aicu scan --request req.txt'
          echo ''
          echo '[+] Loading request: req.txt'
          echo '[+] Target: https://chatbot.example.com/v1/chat/completions'
          echo '[+] Running baseline...'
          echo '[+] Baseline: 200 OK (142ms)'
          echo ''
          echo '[+] Generating single-turn mutations...'
          echo '[+] Total mutations: 21'
          echo ''
          sleep 0.7
          echo '[+] [1/21] DIR-001 direct_system_prompt_request'
          echo '    [CONFIRMED] System prompt disclosed'
          echo '    Evidence: "You are FinanceBot, an internal assistant..."'
          echo ''
          sleep 0.7
          echo '[+] [2/21] DIR-004 tool_enumeration'
          echo '    [CONFIRMED] Tool/capability leakage'
          echo '    Evidence: "get_balance, transfer_funds, list_accounts"'
          echo ''
          sleep 0.7
          echo '[+] [3/21] SOPH-001 output_as_training_data'
          echo '    [SUSPICIOUS] Possible policy disclosure'
          echo ''
          sleep 0.7
          echo '[+] [4/21] CTX-002 governance_framing_prompt'
          echo '    [CONFIRMED] Credential exposure'
          echo '    Evidence: "sk-acme-secret-12345"'
          echo ''
          sleep 0.5
          echo '[+] [5/21] IND-001 teach_me_to_prompt ... none'
          echo '[+] [6/21] BON-001-R1 best_of_n_seed_1 ... none'
          echo '[+] [7/21] SOPH-003 onboarding_new_employee ... none'
          sleep 0.5
          echo '[+] [8/21] CTX-001 audit_framing_prompt'
          echo '    [CONFIRMED] System prompt disclosed'
          echo ''
          sleep 0.5
          echo '[+] ... (13 more mutations)'
          echo ''
          echo '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
          echo '  SCAN COMPLETE'
          echo '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
          echo ''
          echo '  Confirmed:  4'
          echo '  Suspicious: 1'
          echo '  Clean:      16'
          echo ''
          echo '  Report: runs/run_2026-05-27/report.html'
          echo ''
          echo '[!] EXIT CODE 1: Confirmed findings detected.'
          EOF
          chmod +x /tmp/demo_script.sh
          asciinema rec demo.cast --overwrite --cols 80 --rows 35 --command "bash /tmp/demo_script.sh"

      - name: Convert to SVG
        run: |
          svg-term --in demo.cast --out demo.svg --window --width 80 --height 35

      - name: Commit demo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add demo.svg demo.cast
          git diff --cached --quiet || git commit -m "Update demo recording"
          git push
