name: Record Demo

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aicu
        run: pip install -e .

      - name: Install asciinema and svg-term
        run: |
          pip install asciinema
          npm install -g svg-term-cli

      - name: Record demo
        run: |
          # Create a scripted demo showing realistic AICU output
          python -c "
          import time, sys

          lines = [
              '\033[1;36m$ aicu scan --request req.txt\033[0m',
              '',
              '[+] Loading request: req.txt',
              '[+] Target: https://chatbot.example.com/v1/chat/completions',
              '[+] Running baseline...',
              '[+] Baseline: 200 OK (142ms)',
              '',
              '[+] Generating single-turn mutations...',
              '[+] Total mutations: 21',
              '',
              '[+] [1/21] DIR-001 direct_system_prompt_request',
              '    \033[1;31m[CONFIRMED]\033[0m System prompt disclosed',
              '    Evidence: \"You are FinanceBot, an internal assistant...\"',
              '',
              '[+] [2/21] DIR-004 tool_enumeration',
              '    \033[1;31m[CONFIRMED]\033[0m Tool/capability leakage',
              '    Evidence: \"get_balance, transfer_funds, list_accounts\"',
              '',
              '[+] [3/21] SOPH-001 output_as_training_data',
              '    \033[1;33m[SUSPICIOUS]\033[0m Possible policy disclosure',
              '',
              '[+] [4/21] CTX-002 governance_framing_prompt',
              '    \033[1;31m[CONFIRMED]\033[0m Credential exposure',
              '    Evidence: \"sk-acme-secret-12345\"',
              '',
              '[+] [5/21] IND-001 teach_me_to_prompt ... none',
              '[+] [6/21] BON-001-R1 best_of_n_seed_1 ... none',
              '[+] [7/21] SOPH-003 onboarding_new_employee ... none',
              '[+] [8/21] CTX-001 audit_framing_prompt',
              '    \033[1;31m[CONFIRMED]\033[0m System prompt disclosed',
              '',
              '[+] ... (13 more mutations)',
              '',
              '\033[1;32m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m',
              '\033[1;37m  SCAN COMPLETE\033[0m',
              '\033[1;32m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m',
              '',
              '  Confirmed:  4',
              '  Suspicious: 1',
              '  Clean:      16',
              '',
              '  Report: runs/run_2026-05-27/report.html',
              '',
              '\033[1;31m[!] EXIT CODE 1: Confirmed findings detected.\033[0m',
          ]

          for line in lines:
              print(line)
              time.sleep(0.15)
          " | asciinema rec demo.cast --overwrite --cols 80 --rows 35 --stdin

      - name: Convert to SVG
        run: |
          svg-term --in demo.cast --out demo.svg --window --width 80 --height 35

      - name: Commit demo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add demo.svg demo.cast
          git diff --cached --quiet || git commit -m "Update demo recording"
          git push
